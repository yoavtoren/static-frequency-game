    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* iOS enlarges text in landscape unless told not to (Tailwind's base says so too, but only once the CSS is in). */
      html { -webkit-text-size-adjust: 100%; -moz-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { overscroll-behavior: none; -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
      /* The loading screen, here so that it is up before any script: the name and a line that runs, until the home
         screen's picture is in (src/components/ui/bootSplash.ts takes it away). */
      #boot-splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; background: #020405; color: #f5f7f8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; transition: opacity 0.7s ease; }
      #boot-splash.gone { opacity: 0; pointer-events: none; }
      #boot-splash .name { font-size: clamp(1.2rem, 3.4vw, 2.3rem); font-weight: 200; letter-spacing: 0.34em; padding-left: 0.34em; text-transform: uppercase; text-align: center; line-height: 1.25; text-shadow: 0 0 30px rgba(150, 195, 212, 0.3); }
      #boot-splash .name b { font-weight: 600; }
      #boot-splash .bar { position: relative; width: min(15rem, 46vw); height: 1px; overflow: hidden; background: rgba(255, 255, 255, 0.16); }
      #boot-splash .bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 34%; background: #ffb35c; box-shadow: 0 0 8px rgba(255, 179, 92, 0.8); animation: boot-run 1.5s ease-in-out infinite; }
      @keyframes boot-run { 0% { transform: translateX(-110%); } 100% { transform: translateX(310%); } }
      #boot-splash .freq { font-size: 10.5px; letter-spacing: 0.3em; padding-left: 0.3em; text-transform: uppercase; color: rgba(238, 241, 242, 0.45); }
    </style>

  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="name">Static<br /><b>Frequency</b></div>
      <div class="bar"><i></i></div>
      <div class="freq">98.4 MHz</div>
    </div>
    <script>
      // (Whatever happens, it does not stay for ever.)
      setTimeout(function () { var el = document.getElementById('boot-splash'); if (el) { el.className = 'gone'; setTimeout(function () { el.remove(); }, 800); } }, 15000);
    </script>
  </body>
